[project]
name = "tutti-sdk"
version = "0.1.0"
description = "Unofficial Python client for the (reverse-engineered) tutti.ch API — search, listings, seller profiles, categories, suggestions, messaging, and Auth0 login. Port of filippofinke/tutti-api."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/aneshodza/tutti-sdk"
Documentation = "https://aneshodza.github.io/tutti-sdk/"
Changelog = "https://github.com/aneshodza/tutti-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutti_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: hits the real api.tutti.ch (deselect with -m 'not live')",
  "auth: needs an authenticated session (TUTTI_TOKEN or a stored session)",
]

[tool.ruff]
line-length = 100
